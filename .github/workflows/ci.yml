# GitHub Actions - restored 2026-09-14 now that Actions billing on this
# account is unblocked. Runs in parallel with .circleci/config.yml rather
# than replacing it (two independent, redundant CI signals cost nothing
# extra here and catch environment-specific bugs neither alone would -
# see TODO.md's note on the Node 24 registerHooks bug CircleCI's real run
# caught that this dev sandbox's Node v22 was silently masking).
#
# Deliberately stays inside GitHub's free tier for a public repo: only
# standard `ubuntu-latest` runners (unlimited free minutes on public repos,
# no per-minute billing), the standard `actions/*` steps, and Docker
# build/run directly on the runner (Docker ships preinstalled on
# ubuntu-latest - no paid Docker Hub/registry, no larger/custom runners,
# no macOS or Windows runners, which are the ones that actually cost).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the release artifact once
        run: |
          npm run build:worker
          node scripts/worker-artifact.mjs build "$RUNNER_TEMP/mirror-worker-release"
          node scripts/worker-artifact.mjs check "$RUNNER_TEMP/mirror-worker-release" --deployment
      - name: Verify the release artifact in real workerd with synthetic upstream services
        env:
          MIRROR_TEST_BUNDLE_DIR: ${{ runner.temp }}/mirror-worker-release/worker
        run: npm run test:worker
      - run: npm run typecheck
      # .c8rc.json enables check-coverage with 100% thresholds for statements,
      # branches, functions, and lines, enforced separately for every file.
      - name: Enforce 100% coverage across all measures
        run: npm run coverage
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          cleanup: true
          fail_ci_if_error: true
      - run: npm run build
      - name: Verify isolated backup and restore in both key modes
        run: npm run storage:drill
      - run: npx playwright install --with-deps chromium
      - name: Verify browser behavior against the same Worker artifact
        env:
          MIRROR_TEST_BUNDLE_DIR: ${{ runner.temp }}/mirror-worker-release/worker
          MIRROR_TEST_ASSETS_DIR: ${{ runner.temp }}/mirror-worker-release/assets
        run: npm run test:e2e
      - run: npm run manifest -- --check
      - name: Retain the passing deployment artifact
        run: node scripts/worker-artifact.mjs check "$RUNNER_TEMP/mirror-worker-release" --deployment
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-worker-${{ github.sha }}
          path: ${{ runner.temp }}/mirror-worker-release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the verified revision
        run: docker build --build-arg MIRROR_BUILD_REVISION="${{ github.sha }}" -t mirror-verified .
      - name: Verify recovery inside the runtime image without network access
        run: docker run --rm --network none --entrypoint node mirror-verified scripts/restore-drill.mjs
      - name: Verify embedded revision and record image identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker run --rm --network none -e EXPECTED_REVISION --entrypoint node mirror-verified -e 'require("node:assert/strict").equal(process.env.MIRROR_BUILD_REVISION, process.env.EXPECTED_REVISION)'
          docker image inspect --format '{{.Id}} {{index .Config.Labels "org.opencontainers.image.revision"}}' mirror-verified

  deploy:
    if: github.event_name == 'push' && github.repository == 'gptenv/mirror-worker' && github.ref == 'refs/heads/codex/worker-reliability'
    needs: [verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mirror-worker-production
      cancel-in-progress: false
    steps:
      - name: Require confirmed CI access to the existing WARP network
        if: vars.MIRROR_VPC_BIND_CONFIRMED != 'true'
        run: |
          echo '::error::Deployment is paused until the existing CI token has Connectivity Directory Bind for account 711ab96baee8597bf61ed973363715d6. After verifying that permission, set repository variable MIRROR_VPC_BIND_CONFIRMED=true and rerun this failed deployment job. No Cloudflare deployment was attempted.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mirror-worker-${{ github.sha }}
          path: ${{ runner.temp }}/mirror-worker-release
      - name: Verify release identity and bytes
        run: node scripts/worker-artifact.mjs check "$RUNNER_TEMP/mirror-worker-release" --deployment
      - name: Deploy the tested artifact if this is still the branch head
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 711ab96baee8597bf61ed973363715d6
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
          WRANGLER_LOG_SANITIZE: 'true'
        run: node scripts/deploy-worker-artifact.mjs "$RUNNER_TEMP/mirror-worker-release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-worker-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/mirror-worker-deployment.json
          if-no-files-found: warn
          retention-days: 30
