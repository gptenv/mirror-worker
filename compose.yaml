services:
  mirror:
    build:
      context: .
      args:
        MIRROR_BUILD_REVISION: ${MIRROR_BUILD_REVISION:-development}
    ports:
      - "127.0.0.1:${MIRROR_PORT:-8799}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MIRROR_DATA_DIR: /home/node/.mirror
      MIRROR_API_KEY: ${MIRROR_API_KEY:-}
      MIRROR_API_KEYS: ${MIRROR_API_KEYS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MIRROR_STORE_KEY: ${MIRROR_STORE_KEY:-}
      MIRROR_WEB_ORIGIN: ${MIRROR_WEB_ORIGIN:-}
    volumes:
      - mirror-data:/home/node/.mirror
    restart: unless-stopped

volumes:
  mirror-data:
